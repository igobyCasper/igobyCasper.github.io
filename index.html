  .frame {
    width: 100%;
    max-width: 460px;
    border: 3px solid var(--frame);
    border-radius: 6px;
    padding: 40px 24px 30px;
    text-align: center;
    background: rgba(8,10,9,.55);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
  }
  h1 {
    font-weight: 500;
    font-size: clamp(1.2rem, 5.6vw, 1.7rem);
    letter-spacing: .22em;
    margin: 0 0 2px;
    padding-left: .22em; /* balance trailing letter-spacing */
    text-transform: uppercase;
    line-height: 1.2;
  }
  .sub { letter-spacing: .25em; margin: 0; color: var(--soft); }
  .script {
    font: 400 clamp(2.4rem, 12vw, 3.1rem)/1.15 "Pinyon Script", cursive;
    color: var(--coral);
    margin: 18px 0 6px;
  }
  .date { letter-spacing: .3em; margin: 0 0 22px; }
  .intro { color: var(--soft); font-style: italic; max-width: 30ch; margin: 0 auto 26px; }
  .pay { display: grid; gap: 14px; }
  .option { display: flex; gap: 10px; }
  .btn {
    flex: 1;
    display: block;
    padding: 14px 16px;
    border: 1.5px solid var(--ink);
    border-radius: 3px;
    color: var(--night);
    background: var(--ink);
    text-decoration: none;
    font-weight: 600;
    letter-spacing: .2em;
    text-transform: uppercase;
    font-size: 1rem;
    line-height: 1.3;
  }
  .btn.venmo { background: var(--venmo-bg); border-color: var(--venmo-bg); color: var(--venmo-ink); }
  .btn.cash  { background: var(--cash-bg);  border-color: var(--cash-bg);  color: var(--cash-ink); }
  .btn small {
    display: block;
    text-transform: none;
    letter-spacing: .06em;
    font-weight: 500;
    font-size: 1.05rem;
    font-variant-numeric: lining-nums; /* 00 not oo */
    opacity: .75;
  }
  .copy {
    flex: none;
    min-width: 72px;
    border: 1.5px solid var(--frame);
    border-radius: 3px;
    background: transparent;
    color: var(--ink);
    font: 500 .95rem "Cormorant Garamond", Georgia, serif;
    letter-spacing: .15em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .btn:focus-visible, .copy:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  hr { border: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--coral), transparent); width: 70%; margin: 28px auto 18px; }
  .thanks { font: 400 2rem/1.1 "Pinyon Script", cursive; margin: 0 0 8px; }
  .help { color: var(--soft); font-size: .95rem; letter-spacing: .04em; margin: 0; }
  @media (min-width: 700px) {
    body { font-size: 22px; }
    .frame { max-width: 600px; padding: 56px 48px 44px; }
    h1 { font-size: 2.1rem; }
    .script { font-size: 4rem; }
  }
